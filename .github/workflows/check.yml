name: Check

# On every push and pull request: the JSON Schema must agree with the example backlogs
# (schema/test/check-examples.mjs) and with the whitepaper's appendix B
# (schema/test/check-whitepaper.mjs). A change to one without the other fails here.
on:
  push:
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
