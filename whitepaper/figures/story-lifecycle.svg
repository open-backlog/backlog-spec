<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" role="img" aria-labelledby="story-lifecycle-t story-lifecycle-d">
<title id="story-lifecycle-t">A story moving from todo to doing to done</title>
<desc id="story-lifecycle-d">Story 2.3.4 moves from the todo folder to doing to done; each move is a git mv of the same file, so git keeps its history.</desc>
<style>svg{--c-surface:#ffffff;--c-subtle:#f6f8fa;--c-border:#d0d7de;--c-ink:#1f2328;--c-muted:#59636e;--c-brand:#b45309;--c-todo:#59636e;--c-doing:#0a3069;--c-done:#1a7f37}@media (prefers-color-scheme:dark){svg{--c-surface:#0d1117;--c-subtle:#161b22;--c-border:#30363d;--c-ink:#e6edf3;--c-muted:#9198a1;--c-brand:#f0a33a;--c-todo:#9198a1;--c-doing:#2f81f7;--c-done:#3fb950}}.f-surface{fill:var(--ob-surface,var(--c-surface))}.s-surface{stroke:var(--ob-surface,var(--c-surface))}.f-subtle{fill:var(--ob-subtle,var(--c-subtle))}.s-subtle{stroke:var(--ob-subtle,var(--c-subtle))}.f-border{fill:var(--ob-border,var(--c-border))}.s-border{stroke:var(--ob-border,var(--c-border))}.f-ink{fill:var(--ob-ink,var(--c-ink))}.s-ink{stroke:var(--ob-ink,var(--c-ink))}.f-muted{fill:var(--ob-muted,var(--c-muted))}.s-muted{stroke:var(--ob-muted,var(--c-muted))}.f-brand{fill:var(--ob-brand,var(--c-brand))}.s-brand{stroke:var(--ob-brand,var(--c-brand))}.f-todo{fill:var(--ob-todo,var(--c-todo))}.s-todo{stroke:var(--ob-todo,var(--c-todo))}.f-doing{fill:var(--ob-doing,var(--c-doing))}.s-doing{stroke:var(--ob-doing,var(--c-doing))}.f-done{fill:var(--ob-done,var(--c-done))}.s-done{stroke:var(--ob-done,var(--c-done))}text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ob-ink,var(--c-ink));white-space:pre}.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}.b{font-weight:700}.m{fill:var(--ob-muted,var(--c-muted))}</style>
<defs><marker id="ob-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-muted"/></marker></defs>
