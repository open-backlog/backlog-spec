<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" role="img" aria-labelledby="story-lifecycle-t story-lifecycle-d">
<title id="story-lifecycle-t">A story moving from todo to doing to done</title>
<desc id="story-lifecycle-d">Story 2.3.4 moves from the todo folder to doing to done; each move is a git mv of the same file, so git keeps its history.</desc>
<style>.f-surface{fill:#ffffff}.s-surface{stroke:#ffffff}.f-subtle{fill:#f6f8fa}.s-subtle{stroke:#f6f8fa}.f-border{fill:#d0d7de}.s-border{stroke:#d0d7de}.f-ink{fill:#1f2328}.s-ink{stroke:#1f2328}.f-muted{fill:#59636e}.s-muted{stroke:#59636e}.f-brand{fill:#b45309}.s-brand{stroke:#b45309}.f-todo{fill:#59636e}.s-todo{stroke:#59636e}.f-doing{fill:#0a3069}.s-doing{stroke:#0a3069}.f-done{fill:#1a7f37}.s-done{stroke:#1a7f37}text{font-family:'IBM Plex Sans',sans-serif;fill:#1f2328;white-space:pre}.mono{font-family:'IBM Plex Mono',monospace}.b{font-weight:700}.m{fill:#59636e}</style>
<defs><marker id="ob-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-muted"/></marker></defs>
<rect x="8" y="34" width="120" height="96" rx="8" class="f-subtle s-border" stroke-width="1"/>
<text x="68" y="24" font-size="14" class="mono b f-todo" text-anchor="middle">todo</text>
<rect x="16" y="50" width="104" height="60" rx="6" class="f-surface s-border" stroke-width="1"/>
<rect x="16" y="50" width="5" height="60" rx="2" class="f-todo"/>
<text x="30" y="74" font-size="14" class="mono b">2.3.4</text>
<text x="30" y="96" font-size="13" class="m">ob move</text>
<rect x="140" y="34" width="120" height="96" rx="8" class="f-subtle s-border" stroke-width="1"/>
<text x="200" y="24" font-size="14" class="mono b f-doing" text-anchor="middle">doing</text>
<rect x="148" y="50" width="104" height="60" rx="6" class="f-surface s-border" stroke-width="1"/>
<rect x="148" y="50" width="5" height="60" rx="2" class="f-doing"/>
<text x="162" y="74" font-size="14" class="mono b">2.3.4</text>
<text x="162" y="96" font-size="13" class="m">ob move</text>
<rect x="272" y="34" width="120" height="96" rx="8" class="f-subtle s-border" stroke-width="1"/>
<text x="332" y="24" font-size="14" class="mono b f-done" text-anchor="middle">done</text>
<rect x="280" y="50" width="104" height="60" rx="6" class="f-surface s-border" stroke-width="1"/>
<rect x="280" y="50" width="5" height="60" rx="2" class="f-done"/>
<text x="294" y="74" font-size="14" class="mono b">2.3.4</text>
<text x="294" y="96" font-size="13" class="m">ob move</text>
<path d="M72 146 Q134.0 174 196 146" fill="none" class="s-muted" stroke-width="1.5" marker-end="url(#ob-arrow)"/>
<text x="134.0" y="186" font-size="13" class="mono" text-anchor="middle">git mv</text>
<path d="M204 146 Q266.0 174 328 146" fill="none" class="s-muted" stroke-width="1.5" marker-end="url(#ob-arrow)"/>
<text x="266.0" y="186" font-size="13" class="mono" text-anchor="middle">git mv</text>
<text x="200" y="220" font-size="13" class="m" text-anchor="middle">Same file, new folder: git keeps its history.</text>
